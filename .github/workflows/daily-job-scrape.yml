name: Daily Job Scrape

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger secure scrape endpoint
        env:
          SCRAPE_URL: ${{ secrets.SCRAPE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SCRAPE_URL" ]; then
            echo "Missing required GitHub secret: SCRAPE_URL"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required GitHub secret: CRON_SECRET"
            exit 1
          fi

          curl --fail --show-error --silent \
            --request GET \
            --url "$SCRAPE_URL" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json"
